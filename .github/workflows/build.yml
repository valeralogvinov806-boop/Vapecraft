
name: Build VapeCraft

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build VapeCraft
        run: gradle -p VapeCraft build --no-daemon

      - name: Upload Minecraft mod
        uses: actions/upload-artifact@v4
        with:
          name: VapeCraft-Minecraft-1.20.1
          path: VapeCraft/build/libs/*.jar
          if-no-files-found: error
